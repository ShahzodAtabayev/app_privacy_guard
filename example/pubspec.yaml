name: app_privacy_guard_example
description: "Demonstrates how to use the app_privacy_guard plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  app_privacy_guard:
    path: ../
  material_ui: ^1.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Use Swift Package Manager (no CocoaPods) for iOS in this project only.
  config:
    enable-swift-package-manager: true
